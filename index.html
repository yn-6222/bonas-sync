<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BonusSync">
<meta name="theme-color" content="#f4f4f6">
<title>BonusSync</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#f4f4f6;color:#1d1d1f;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;border:0;background:none;margin:0}
button{cursor:pointer}button:active{opacity:.6}
input,select{font-size:16px;outline:none;min-width:0}
#main{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0}
.f{display:flex;align-items:center}.bt{justify-content:space-between}.g8{gap:8px}.g12{gap:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:16px;border:.5px solid rgba(0,0,0,.06);box-shadow:0 2px 10px rgba(0,0,0,.03);padding:12px 16px;margin-bottom:10px}
.sub{font-size:11px;color:#86868b}
.cap{font-size:13px;font-weight:600;color:#86868b;margin:18px 4px 8px}
.btn{background:#0071e3;color:#fff;border-radius:999px;padding:8px 18px;font-weight:600;font-size:14px;white-space:nowrap;flex-shrink:0;writing-mode:horizontal-tb}
.btn.big{width:100%;border-radius:16px;padding:15px;font-size:16px;box-shadow:0 6px 18px rgba(0,113,227,.25)}
.btn.sm{border-radius:10px;padding:10px 18px}
.nav{width:36px;height:36px;border-radius:10px;background:#f4f4f6;color:#0071e3;font-size:20px;font-weight:700}
.big-n{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.sum{color:#d97706}.win{color:#4f46e5}
.line{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:600;margin:12px 0}
.line i{flex:1;height:1px;background:currentColor;opacity:.3}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:.5px solid #f0f0f2}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid #d2d2d7;color:transparent;font-size:12px;flex-shrink:0}
.chk.on{background:#34c759;border-color:#34c759;color:#fff;font-weight:700}
.mid{flex:1;min-width:0}.mid b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done{text-decoration:line-through;color:#86868b}
.amtc{font-weight:600;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 16px;padding:0 16px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:8px 16px;border-radius:999px;background:#fff;border:.5px solid #d2d2d7;font-size:14px;font-weight:500;white-space:nowrap}
.pill.on,.mc.on{background:#0071e3;color:#fff;border-color:#0071e3;box-shadow:0 4px 12px rgba(0,113,227,.3)}
#bar{position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;display:flex;padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(25px);backdrop-filter:blur(25px);border-top:.5px solid rgba(0,0,0,.1);z-index:20}
#bar button{flex:1;padding:10px 0 8px;font-size:11px;font-weight:500;color:#86868b;display:flex;flex-direction:column;align-items:center;gap:3px}
#bar button.on{color:#0071e3;font-weight:600}
#mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;opacity:0;pointer-events:none;transition:opacity .3s}
#mask.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#f4f4f6;border-radius:28px 28px 0 0;z-index:40;transform:translateY(105%);transition:transform .4s cubic-bezier(.32,.72,0,1);box-shadow:0 -10px 40px rgba(0,0,0,.15)}
#sheet.on{transform:none}
.shh{position:sticky;top:0;z-index:2;background:rgba(244,244,246,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.grab{width:36px;height:4px;border-radius:2px;background:#d2d2d7;margin:10px auto 6px}
.pad{padding:0 20px 16px}
.seg{display:flex;background:#e5e5ea;border-radius:14px;padding:3px;gap:2px}
.seg button{flex:1;padding:9px 0;border-radius:11px;font-size:14px;font-weight:500;color:#3a3a3c}
.seg button.on{background:#fff;color:#1d1d1f;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.grp{background:#fff;border-radius:20px;overflow:hidden;border:.5px solid rgba(0,0,0,.06)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:50px;border-top:.5px solid #f0f0f2}
.row:first-child{border-top:0}
.row input,.row select{flex:1;text-align:right;text-align-last:right;color:#0071e3}
.fld{width:100%;background:#fff;border:1px solid #d2d2d7;border-radius:12px;padding:12px 14px}
.fld:focus{border-color:#0071e3;box-shadow:0 0 0 4px rgba(0,113,227,.12)}
.name{width:100%;text-align:center;font-size:18px;font-weight:600;padding:6px 0}
.amt{display:flex;justify-content:center;align-items:center;gap:4px;font-size:38px;font-weight:700}
.amt input{width:60%;text-align:center;font-size:38px;font-weight:700}
.six{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.mc{position:relative;padding:8px 0;border-radius:14px;background:#fff;border:.5px solid #e5e5ea;text-align:center;font-weight:600;line-height:1.2}
.mc small{display:block;font-size:10px;font-weight:400;opacity:.85;min-height:12px;overflow:hidden;text-overflow:ellipsis}
.mc em{position:absolute;top:3px;right:5px;font-size:10px;font-style:normal;font-weight:700}
.danger{color:#ff3b30;font-weight:600;font-size:13px;padding:4px 10px;border-radius:8px;background:#fef2f2}
.stick{position:sticky;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(244,244,246,0),#f4f4f6 40%)}
.yrs{display:flex;gap:8px}.yrs>div{flex:1;border-radius:12px;padding:10px 12px;background:#fffbeb;color:#b45309}.yrs>div+div{background:#eef2ff;color:#4338ca}
</style>
</head>
<body>
<div id="main"></div>
<nav id="bar">
 <button id="btn-tl" class="on" onclick="go('tl')"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>タイムライン</button>
 <button id="btn-st" onclick="go('st')"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.2 4.2l2.8 2.8M17 17l2.8 2.8M1 12h4M19 12h4M4.2 19.8L7 17M17 7l2.8-2.8"/></svg>設定</button>
</nav>
<div id="mask" onclick="closeF()"></div>
<div id="sheet"></div>

<script>
'use strict';
const KEY='bonussync.v1';
const DEF=()=>({bonus:{s:6,w:12},cats:['住まい','クルマ','イベント','保険','その他'],items:[]});
const SL={s:'夏枠',w:'冬枠',n:'枠なし'};
const PRE=[
 {n:'固定資産税',c:'住まい',t:'p',ms:[202704,202707,202712,202802]},
 {n:'自動車税',c:'クルマ',t:'s',m:5},
 {n:'車検',c:'クルマ',t:'s',m:11},
 {n:'自動車保険',c:'保険',t:'s',m:3},
 {n:'火災保険',c:'保険',t:'s',m:9}
];
const NOW=new Date(),CY=NOW.getFullYear(),CM=NOW.getMonth()+1;
const $=s=>document.querySelector(s);
const yen=n=>'¥'+Math.round(n||0).toLocaleString('ja-JP');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=v=>(v===''||v==null||isNaN(+v))?'':Math.round(+v).toLocaleString('ja-JP');
let S=load(),tab='tl',VY=CY,F=null,saveFailed=false;

/* ---- 保存・読込 ---- */
function norm(d){
 if(!d||!Array.isArray(d.items)||!Array.isArray(d.cats)||!d.bonus)throw new Error('bad');
 const mo=v=>{v=Math.trunc(+v);return v>=1&&v<=12?v:null};
 const o={bonus:{s:mo(d.bonus.s)||6,w:mo(d.bonus.w)||12},
  cats:[...new Set(d.cats.map(c=>String(c).trim().slice(0,20)).filter(Boolean))],items:[]};
 if(o.bonus.s===o.bonus.w)o.bonus.w=o.bonus.s===12?6:12;
 if(!o.cats.length)o.cats=DEF().cats;
 for(const x of d.items){
  if(!x||!Array.isArray(x.e))throw new Error('bad');
  const e=x.e.map(z=>({y:Math.trunc(+z.y)||CY,m:Math.min(12,Math.max(1,Math.trunc(+z.m)||1)),a:Number.isFinite(+z.a)?+z.a:0,...(z.p?{p:1}:{})}));
  o.items.push({...x,e,
   id:String(x.id||uid()).replace(/[^\w-]/g,''),
   n:String(x.n??'').slice(0,100),c:String(x.c??o.cats[0]),
   t:['s','p','m'].includes(x.t)?x.t:'s',
   sl:['a','s','w','n'].includes(x.sl)?x.sl:'a',
   y:Math.trunc(+x.y)||e[0]?.y||CY,
   ms:Array.isArray(x.ms)?x.ms.map(Number).filter(v=>Number.isInteger(v)&&v>=10000).sort((a,b)=>a-b):[]});
 }
 return o;
}
function load(){
 let raw=null;
 try{raw=localStorage.getItem(KEY)}catch(e){}
 if(raw){
  try{return norm(JSON.parse(raw))}
  catch(e){try{localStorage.setItem(KEY+'.broken',raw)}catch(_){}}
 }
 return DEF();
}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(S))}
 catch(e){if(!saveFailed){saveFailed=true;alert('保存できませんでした。設定タブのエクスポートでバックアップしてください')}}
}

/* ---- ロジック ---- */
const autoSlot=m=>((m-S.bonus.s+12)%12)<=((m-S.bonus.w+12)%12)?'s':'w';
const slotOf=(it,m)=>it.sl==='a'?autoSlot(m):it.sl;
const entries=()=>S.items.flatMap(it=>it.e.map((x,i)=>({it,x,i,s:slotOf(it,x.m)})));
function amts(f){
 const n=f.ms.length,T=Math.round(+f.tot||0);
 if(!n)return[];
 if(n===1)return[T];
 const hasFirst=f.first!=null&&f.first!=='';
 const fr=hasFirst?Math.round(+f.first):null;
 const rest=hasFirst?T-fr:T,cnt=hasFirst?n-1:n,b=Math.floor(rest/cnt);
 const a=Array(cnt).fill(b);a[cnt-1]+=rest-b*cnt;
 return hasFirst?[fr,...a]:a;
}
function build(f,old){
 const paid=new Map((old||[]).filter(x=>x.p).map(x=>[x.y*100+x.m,x.a]));
 const R=v=>Math.round(+v)||0;
 let e=[];
 if(f.t==='s')e=[{y:+f.y,m:+f.m,a:R(f.amt)}];
 else if(f.t==='p'){const a=amts(f);e=f.ms.map((v,i)=>({y:Math.floor(v/100),m:v%100,a:a[i]}))}
 else{
  const n=Math.min(480,Math.max(1,(f.ey-f.sy)*12+(f.en-f.st)+1));
  let y=+f.sy,m=+f.st;
  for(let k=0;k<n;k++){e.push({y,m,a:R(f.mon)});if(++m>12){m=1;y++}}
 }
 for(const x of e){const k=x.y*100+x.m;if(paid.has(k)){x.p=1;if(f.t==='m')x.a=paid.get(k)}}
 return e;
}
function tg(id,i){
 const it=S.items.find(v=>v.id===id);
 if(!it||!it.e[i])return;
 it.e[i].p=it.e[i].p?0:1;
 if(!it.e[i].p)delete it.e[i].p;
 save();render();
}

/* ---- 描画 ---- */
function render(){
 $('#main').innerHTML=tab==='tl'?tl():st();
 $('#btn-tl').className=tab==='tl'?'on':'';
 $('#btn-st').className=tab==='st'?'on':'';
}
function go(t){tab=t;render();scrollTo(0,0)}
function tl(){
 const all=entries(),inY=all.filter(r=>r.x.y===VY);
 const fundY=r=>r.x.m>=S.bonus[r.s]?r.x.y:r.x.y-1;
 const sum=k=>all.filter(r=>r.s===k&&!r.x.p&&fundY(r)===VY).reduce((a,r)=>a+r.x.a,0);
 let h=`<div class="f bt" style="margin-bottom:12px"><h1>BonusSync</h1><button class="btn" onclick="openF()">＋ 追加</button></div>
 <div class="card f bt" style="padding:8px 16px"><button class="nav" aria-label="前の年" onclick="VY--;render()">‹</button><b>${VY}年</b><button class="nav" aria-label="次の年" onclick="VY++;render()">›</button></div>
 <div class="g2" style="margin-bottom:12px">
  <div class="card" style="margin:0"><b class="sum" style="font-size:12px">夏ボーナス枠</b><div class="sub">(${VY}年${S.bonus.s}月)</div><div class="big-n sum">${yen(sum('s'))}</div><div class="sub">必要確保額</div></div>
  <div class="card" style="margin:0"><b class="win" style="font-size:12px">冬ボーナス枠</b><div class="sub">(${VY}年${S.bonus.w}月)</div><div class="big-n win">${yen(sum('w'))}</div><div class="sub">必要確保額</div></div>
 </div>
 <div class="sub" style="margin-bottom:16px">各枠は、支給月以降の出費（翌年に及ぶ分を含む）をその支給月の枠として集計します。</div>
 <div class="cap" style="margin-top:0">クイックテンプレート</div>
 <div class="chips">${PRE.map((p,i)=>`<button class="pill" onclick="preset(${i})">${esc(p.n)}</button>`).join('')}</div>`;
 for(let m=1;m<=12;m++){
  const rs=inY.filter(r=>r.x.m===m),isS=m===S.bonus.s,isW=m===S.bonus.w;
  if(isS||isW)h+=`<div class="line ${isS?'sum':'win'}"><i></i><span>${isS?'夏':'冬'}ボーナス支給月 (${VY}年${m}月)</span><i></i></div>`;
  if(!rs.length){h+=`<div class="f bt sub" style="padding:6px 16px;font-size:14px"><span>${m}月</span><span>—</span></div>`;continue}
  const rest=rs.filter(r=>!r.x.p).reduce((a,r)=>a+r.x.a,0);
  h+=`<div class="card" style="padding-bottom:0"><div class="f bt" style="font-weight:600;font-size:14px"><span>${m}月</span><span class="sub" style="font-weight:400;font-size:12px">残 ${yen(rest)}</span></div>`+
  rs.map(r=>`<div class="item"><button class="chk ${r.x.p?'on':''}" aria-label="支払い済み" onclick="tg('${r.it.id}',${r.i})">✓</button>
   <div class="mid" onclick="openF('${r.it.id}')"><b class="${r.x.p?'done':''}">${esc(r.it.n)}</b><span class="sub">${esc(r.it.c)} · ${SL[r.s]}${r.it.t==='m'?' · 毎月':r.it.t==='p'?' · 分割':''}</span></div>
   <div class="amtc ${r.x.p?'done':''}" onclick="openF('${r.it.id}')">${yen(r.x.a)}</div></div>`).join('')+`</div>`;
 }
 const nx=all.filter(r=>r.it.t==='p'&&r.x.y===VY+1&&r.it.e.some(z=>z.y===VY));
 if(nx.length)h+=`<div class="cap">${VY+1}年に続く支払い</div><div class="card">`+nx.map(r=>`<div class="item" style="cursor:pointer" onclick="openF('${r.it.id}')"><div style="width:44px;color:#86868b;font-size:14px">${r.x.m}月</div><div class="mid"><b>${esc(r.it.n)}</b><span class="sub">${esc(r.it.c)} · ${SL[r.s]}</span></div><div class="amtc">${yen(r.x.a)}</div></div>`).join('')+`</div>`;
 return h;
}
function st(){
 const mo=v=>[...Array(12)].map((_,i)=>`<option value="${i+1}" ${v===i+1?'selected':''}>${i+1}月</option>`).join('');
 return `<h1 style="margin-bottom:20px">設定</h1>
 <div class="card" style="padding:18px"><b style="font-size:14px">ボーナス月</b>
  <div class="sub" style="margin:12px 0 4px">夏ボーナス月</div><select class="fld" onchange="setB('s',this.value)">${mo(S.bonus.s)}</select>
  <div class="sub" style="margin:12px 0 4px">冬ボーナス月</div><select class="fld" onchange="setB('w',this.value)">${mo(S.bonus.w)}</select>
  <div class="sub" style="margin-top:10px">「自動」の枠は、直前のボーナス月に自動で振り分けられます。</div></div>
 <div class="card" style="padding:18px"><b style="font-size:14px">カテゴリ</b>
  ${S.cats.map((c,i)=>`<div class="item f bt"><span style="font-size:14px;font-weight:500">${esc(c)}</span><button class="danger" onclick="delCat(${i})">削除</button></div>`).join('')}
  <div class="f g8" style="margin-top:12px"><input id="nc" class="fld" placeholder="新しいカテゴリ" maxlength="20" enterkeyhint="done" onkeydown="if(event.key==='Enter')addCat()"><button class="btn sm" onclick="addCat()">追加</button></div></div>
 <div class="card" style="padding:18px"><b style="font-size:14px">データ管理</b>
  <button class="btn big" style="margin:12px 0 10px;font-size:14px;padding:13px" onclick="exp()">JSONエクスポート</button>
  <label class="f" style="justify-content:center;background:#f4f4f6;border:1px solid #d2d2d7;border-radius:16px;padding:13px;font-weight:600;font-size:14px;cursor:pointer">JSONインポート<input type="file" accept="application/json,.json" style="display:none" onchange="imp(this)"></label>
  <div class="sub" style="margin-top:12px">データはこの端末のブラウザ（localStorage）にのみ保存されます。</div></div>`;
}
function setB(k,v){
 v=+v;
 if(S.bonus[k==='s'?'w':'s']===v){alert('夏と冬は別の月にしてください');render();return}
 S.bonus[k]=v;save();
}
function addCat(){
 const v=$('#nc').value.trim().slice(0,20);
 if(!v)return;
 if(S.cats.includes(v))return alert('すでに登録されています');
 S.cats.push(v);save();render();
}
function delCat(i){
 if(S.cats.length<2)return alert('カテゴリは1つ以上必要です');
 if(confirm(`「${S.cats[i]}」を削除しますか？（登録済みの出費は残ります）`)){S.cats.splice(i,1);save();render()}
}
function exp(){
 const d=new Date(),p=n=>String(n).padStart(2,'0');
 const name=`bonussync-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`;
 const file=new File([JSON.stringify(S,null,1)],name,{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(()=>{});return}
 const url=URL.createObjectURL(file),a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function imp(inp){
 const f=inp.files[0];if(!f)return;
 f.text().then(t=>{
  const d=norm(JSON.parse(t));
  if(!confirm('現在のデータを上書きしますか？'))return;
  S=d;save();VY=CY;render();
 }).catch(()=>alert('読み込めませんでした'));
 inp.value='';
}

/* ---- 登録・編集シート ---- */
function newF(){
 const st=VY===CY?CM:1,tot=VY*12+st-1+11;
 return {id:null,n:'',c:S.cats[0],t:'s',sl:'a',y:VY,wy:VY,m:st,amt:'',ms:[],tot:'',first:null,sy:VY,st,ey:Math.floor(tot/12),en:tot%12+1,mon:''};
}
function openF(id){
 const it=id&&S.items.find(v=>v.id===id);
 F=it?structuredClone(it):newF();
 if(!S.cats.includes(F.c))F.c=S.cats.includes('その他')?'その他':S.cats[0];
 F.wy=it?(F.t==='p'&&F.ms.length?Math.floor(F.ms[0]/100):F.y):VY;
 if(F.sy==null){F.sy=F.y;F.st=F.e[0].m;const l=F.e[F.e.length-1];F.ey=l.y;F.en=l.m}
 sheet();
}
function preset(i){
 const p=PRE[i];
 F=Object.assign(newF(),{n:p.n,c:S.cats.includes(p.c)?p.c:S.cats[0],t:p.t});
 if(p.m)F.m=p.m;
 if(p.ms){F.ms=[...p.ms];F.wy=Math.floor(F.ms[0]/100)}
 sheet();
}
function closeF(){
 $('#mask').classList.remove('on');
 const sh=$('#sheet');sh.classList.remove('on');sh.scrollTop=0;
 document.body.style.overflow='';F=null;
}
const setT=k=>{F.t=k;if(k==='p'&&!F.ms.length)F.wy=VY;sheet()};
const setSl=k=>{F.sl=k;sheet()};
const setC=i=>{F.c=S.cats[i];sheet()};
const setV=m=>{F.y=F.wy;F.m=m;sheet()};
const setWY=d=>{F.wy+=d;sheet()};
function tm(m){
 const v=F.wy*100+m,i=F.ms.indexOf(v);
 if(i>=0)F.ms.splice(i,1);
 else{if(F.ms.length>=12)return;F.ms.push(v);F.ms.sort((a,b)=>a-b)}
 F.first=null;sheet();
}
const ys=(v,x=10)=>{let o='';for(let y=Math.min(CY-1,+v);y<=Math.max(CY+x,+v);y++)o+=`<option value="${y}" ${+v===y?'selected':''}>${y}年</option>`;return o};
function fmtIn(el,key){
 const raw=el.value.replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-65248)).replace(/\D/g,'').replace(/^0+(?=\d)/,'').slice(0,10);
 F[key]=raw;el.value=raw?Number(raw).toLocaleString('ja-JP'):'';
 if(key==='tot'){F.first=null;pv()}else if(key==='first')pvRest();
}
function sheet(){
 const sh=$('#sheet'),y=sh.scrollTop;
 $('#mask').classList.add('on');sh.classList.add('on');document.body.style.overflow='hidden';
 const mo=v=>[...Array(12)].map((_,i)=>`<option value="${i+1}" ${+v===i+1?'selected':''}>${i+1}月</option>`).join('');
 const seg=(arr,cur,fn)=>`<div class="seg">${arr.map(([k,l])=>`<button class="${cur===k?'on':''}" onclick="${fn}('${k}')">${l}</button>`).join('')}</div>`;
 const hk={s:'amt',p:'tot',m:'mon'}[F.t],hl={s:'金額',p:'年間合計',m:'月額'}[F.t];
 const a=F.t==='p'?amts(F):[];
 const chipS=[...Array(12)].map((_,i)=>`<button class="mc ${F.y===F.wy&&F.m===i+1?'on':''}" onclick="setV(${i+1})">${i+1}月<small></small></button>`).join('');
 const chipP=[...Array(12)].map((_,i)=>{
  const m=i+1,v=F.wy*100+m,k=F.ms.indexOf(v),on=k>=0;
  return `<button class="mc ${on?'on':''}" onclick="tm(${m})">${on?`<em>${'①②③④⑤⑥⑦⑧⑨⑩⑪⑫'[k]}</em>`:''}${m}月<small>${on?`<span id="ca${v}">${yen(a[k])}</span>`:''}</small></button>`}).join('');
 const step=`<div class="cap f bt"><span>${F.t==='p'?'支払う月にチェック（年またぎ可）':'発生月'}</span><span class="f"><button class="nav" style="width:32px;height:32px;background:#fff" aria-label="前の年" onclick="setWY(-1)">‹</button><span style="width:64px;text-align:center;color:#1d1d1f;font-weight:600">${F.wy}年</span><button class="nav" style="width:32px;height:32px;background:#fff" aria-label="次の年" onclick="setWY(1)">›</button></span></div>`;
 const when=F.t==='s'?`${step}<div class="six">${chipS}</div>`
  :F.t==='p'?`${step}<div class="six">${chipP}</div><div id="pv"></div>`
  :`<div class="cap">期間</div><div class="grp"><div class="row"><span>開始</span><select onchange="F.sy=+this.value">${ys(F.sy)}</select><select onchange="F.st=+this.value">${mo(F.st)}</select></div><div class="row"><span>終了</span><select onchange="F.ey=+this.value">${ys(F.ey,40)}</select><select onchange="F.en=+this.value">${mo(F.en)}</select></div></div>`;
 sh.innerHTML=`<div class="shh"><div class="grab"></div><div class="f bt" style="padding:4px 20px 12px"><button style="color:#0071e3;width:80px;text-align:left" onclick="closeF()">閉じる</button><b>${F.id?'出費を編集':'新しい出費'}</b><span style="width:80px"></span></div></div>
 <div class="pad">
  ${seg([['s','単発'],['p','複数回'],['m','毎月']],F.t,'setT')}
  <div class="grp" style="margin-top:16px;padding:16px;text-align:center">
   <input class="name" value="${esc(F.n)}" placeholder="項目名（例：固定資産税）" oninput="F.n=this.value">
   <div class="amt"><span style="color:#86868b;font-weight:400">¥</span><input type="text" inputmode="numeric" placeholder="0" value="${fmt(F[hk])}" oninput="fmtIn(this,'${hk}')"></div>
   <div class="sub" style="margin-top:4px;font-size:12px">${hl}</div>
  </div>
  <div class="cap">カテゴリ</div>
  <div class="chips" style="margin:0 -20px;padding:0 20px">${S.cats.map((c,i)=>`<button class="pill ${c===F.c?'on':''}" onclick="setC(${i})">${esc(c)}</button>`).join('')}</div>
  ${when}
  <div class="cap">引き当てボーナス枠${F.sl==='a'?'（自動＝直前の支給月）':''}</div>
  ${seg([['a','自動'],['s','夏ボーナス'],['w','冬ボーナス'],['n','なし']],F.sl,'setSl')}
  ${F.id?`<button class="grp" style="width:100%;margin-top:16px;padding:13px;color:#ff3b30;font-weight:600;font-size:14px" onclick="delF()">この出費を削除</button>`:''}
 </div>
 <div class="stick"><button class="btn big" onclick="saveF()">保存</button></div>`;
 sh.scrollTop=y;
 if(F.t==='p')pv();
}
function pv(){
 const el=$('#pv');if(!el)return;
 if(!F.ms.length){el.innerHTML='';return}
 const a=amts(F),g={};
 F.ms.forEach(v=>(g[Math.floor(v/100)]??=[]).push(v%100+'月'));
 const f0=F.ms[0];
 el.innerHTML=`<div class="yrs" style="margin-top:12px">${Object.keys(g).map(y=>`<div><div class="sub" style="color:inherit">${y}年</div><b style="font-size:14px">${g[y].join('・')}</b></div>`).join('')}</div>`+
 (F.ms.length>=2?`<div class="cap">起点（${Math.floor(f0/100)}年${f0%100}月）だけ金額を変更できます。残りは自動で再等分</div><div class="grp"><label class="row"><span>${f0%100}月の金額</span><input type="text" inputmode="numeric" value="${fmt(a[0])}" oninput="fmtIn(this,'first')"></label></div>`:'');
 pvRest();
}
function pvRest(){
 const a=amts(F);
 F.ms.forEach((v,i)=>{const e=document.getElementById('ca'+v);if(e)e.textContent=yen(a[i])});
}
function saveF(){
 if(!F.n.trim())return alert('項目名を入力してください');
 const amt=+({s:F.amt,p:F.tot,m:F.mon}[F.t]);
 if(!Number.isFinite(amt)||amt<=0||amt>1e9)return alert('金額は1円〜10億円で入力してください');
 if(F.t==='p'){
  if(!F.ms.length)return alert('支払月を選んでください');
  if(F.first!=null&&F.first!==''&&(+F.first<0||+F.first>amt))return alert('初回金額は0〜合計額の範囲で入力してください');
  F.y=Math.floor(F.ms[0]/100);
 }
 if(F.t==='m'){
  const n=(F.ey-F.sy)*12+(F.en-F.st)+1;
  if(n<1)return alert('終了が開始より前になっています');
  if(n>480)return alert('毎月払いは最大40年（480か月）までです');
  F.y=F.sy;
 }
 const old=F.id&&S.items.find(v=>v.id===F.id);
 const it={...F,n:F.n.trim(),id:F.id||uid()};
 delete it.wy;
 it.e=build(it,old?old.e:[]);
 if(old)Object.assign(old,it);else S.items.push(it);
 save();VY=it.t==='m'?+it.sy:+it.y;closeF();render();
}
function delF(){
 if(!confirm('削除しますか？'))return;
 S.items=S.items.filter(v=>v.id!==F.id);
 save();closeF();render();
}
render();
try{navigator.storage?.persist?.()}catch(e){}
</script>
</body>
</html>
